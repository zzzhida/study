<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>纸杯搭建台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700&display=swap">
<style>
/* Layout: a workbench — tool rail and live 3D stage on the left, the three drafting views (and the real photos) pinned on the right. Classroom palette: grey desk, blue chair, paper-cup ivory, black straw. */
:root {
  --bg: #eceeed;
  --surface: #ffffff;
  --fg: #1c2225;
  --muted: #5b6569;
  --line: #d3d8d9;
  --accent: #2b67a8;
  --accent-soft: #e2ecf7;
  --warm: #c06f27;
  --warm-soft: #f8eadc;
  --green: #2f7d4f;
  --green-soft: #e0f0e6;
  --scene-bg: #e3e7e7;
  --floor: #c9cfd0;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-display: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181a; --surface: #1d2225; --fg: #e4e8e8; --muted: #98a3a7; --line: #323a3e;
    --accent: #7db0e8; --accent-soft: #1f3247; --warm: #e5a262; --warm-soft: #3a2a1b;
    --green: #7fcf9e; --green-soft: #1c3226;
    --scene-bg: #20262a; --floor: #2a3034; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181a; --surface: #1d2225; --fg: #e4e8e8; --muted: #98a3a7; --line: #323a3e;
  --accent: #7db0e8; --accent-soft: #1f3247; --warm: #e5a262; --warm-soft: #3a2a1b;
  --green: #7fcf9e; --green-soft: #1c3226;
  --scene-bg: #20262a; --floor: #2a3034; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 48px; display: grid; gap: 16px; }
header { display: grid; gap: 4px; }
h1 { font-family: var(--font-display); font-size: clamp(26px, 4vw, 34px); line-height: 1.2; margin: 0; letter-spacing: 0.02em; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; max-width: 66ch; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
select, .btn { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 6px 12px; }
.btn { cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: default; }
.count { margin-left: auto; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.count b { color: var(--fg); }
.bench { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .bench { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.stage { position: relative; aspect-ratio: 4 / 3; max-width: 100%; background: var(--scene-bg); touch-action: none; cursor: crosshair; }
.stage canvas { display: block; width: 100%; height: 100%; }
.toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--fg); color: var(--surface); font-size: 13px; padding: 5px 12px; border-radius: 999px; pointer-events: none; opacity: 0; transition: opacity .2s; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
.toast.on { opacity: 0.92; }
.hint { position: absolute; left: 12px; bottom: 8px; font-size: 12px; color: var(--muted); pointer-events: none; }
.tools { display: grid; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row .lab { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; min-width: 3.5em; }
.seg { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; padding: 5px 11px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.seg kbd { font-family: inherit; font-size: 11px; color: var(--muted); }
.seg[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.seg[aria-pressed="true"] kbd { color: var(--accent); }
.seg:focus-visible, .btn:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.side { display: grid; gap: 12px; }
.views { padding: 12px; display: grid; gap: 8px; }
.views h2, .photos h2, .note h2 { font-size: 13px; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; margin: 0; }
.vgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.vcell { display: grid; gap: 2px; }
.vcell canvas { width: 100%; aspect-ratio: 4 / 3; border-radius: 6px; background: var(--scene-bg); display: block; }
.vcell span { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.vcell button { font: inherit; font-size: 12px; border: none; background: none; color: var(--accent); cursor: pointer; padding: 0; }
.photos { padding: 12px; display: grid; gap: 8px; }
.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pgrid figure { margin: 0; display: grid; gap: 2px; }
.pgrid img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; display: block; background: var(--scene-bg); }
.pgrid figcaption { font-size: 12px; color: var(--muted); }
.note { padding: 12px 14px; display: grid; gap: 6px; }
.note p { margin: 0; font-size: 14px; max-width: 70ch; }
.note .hidden-cup { border-left: 3px solid var(--warm); background: var(--warm-soft); padding: 8px 12px; border-radius: 0 8px 8px 0; }
.note .design { border-left: 3px solid var(--green); background: var(--green-soft); padding: 8px 12px; border-radius: 0 8px 8px 0; }
details.code { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
details.code summary { cursor: pointer; font-weight: 500; }
details.code textarea { width: 100%; min-height: 110px; margin-top: 10px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: vertical; }
.undo-tip { margin: 0; font-size: 13px; line-height: 1.6; color: var(--muted); }
.undo-tip b { color: var(--ink, inherit); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
.fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; text-align: center; color: var(--muted); }
.fallback[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>纸杯搭建台</h1>
    <p class="sub">载入两轮活动二的目标结构，或者自己搭一个新的。点桌面放杯，点杯顶叠层；拖动旋转视角。右侧三视图随时更新，可以直接拿来出题。</p>
  </header>

  <div class="bar">
    <select id="preset" aria-label="选择结构"></select>
    <button class="btn" id="btn-new">新建空白</button>
    <button class="btn" id="btn-undo" disabled>撤销</button>
    <span class="count" id="count"></span>
  </div>

  <div class="bench">
    <section class="panel" aria-label="搭建区">
      <div class="stage" id="stage">
        <div class="fallback" id="fallback" hidden>3D 画面加载失败，请检查网络后刷新。</div>
        <div class="toast" id="toast" role="status"></div>
        <span class="hint">左键放置 · 右键拿走 · 拖动旋转 · 滚轮缩放</span>
      </div>
      <div class="tools">
        <div class="row" role="group" aria-label="工具">
          <span class="lab">工具</span>
          <button class="seg" data-tool="up" id="t-up">正放 <kbd>1</kbd></button>
          <button class="seg" data-tool="down" id="t-down">倒扣 <kbd>2</kbd></button>
          <button class="seg" data-tool="side" id="t-side">侧放 <kbd>3</kbd></button>
          <button class="seg" data-tool="straw" id="t-straw">吸管 <kbd>4</kbd></button>
          <button class="seg" data-tool="erase" id="t-erase">拿走 <kbd>5</kbd></button>
        </div>
        <div class="row" role="group" aria-label="朝向" id="dirrow">
          <span class="lab">朝向</span>
          <button class="seg" data-dir="front" id="d-front">朝前</button>
          <button class="seg" data-dir="back" id="d-back">朝后</button>
          <button class="seg" data-dir="left" id="d-left">朝左</button>
          <button class="seg" data-dir="right" id="d-right">朝右</button>
          <span class="lab" style="min-width:auto">R 键轮换</span>
        </div>
        <div class="row" role="group" aria-label="吸管角度" id="tiltrow">
          <span class="lab">吸管</span>
          <button class="seg" data-stype="bent" id="s-bent">90°折弯</button>
          <button class="seg" data-stype="up" id="s-up">直插·头朝上</button>
          <button class="seg" data-stype="down" id="s-down">直插·头朝下</button>
          <span class="lab" style="min-width:auto" id="stype-hint"></span>
        </div>
        <p class="undo-tip">放错了？点上方「撤销」或按 Ctrl+Z 退回上一步。要拔吸管、拿走杯：选「拿走」工具点它，或直接<b>右键</b>点它，一次拿掉一样（先拔吸管，再拿最上层的杯）。</p>
        <div class="legend"><span><i style="background:#b4d0f0"></i>正放</span><span><i style="background:#f5cfa6"></i>倒扣</span><span><i style="background:#bfe3c9"></i>侧放</span><span>（颜色可在右上切换为原色）</span></div>
      </div>
    </section>

    <div class="side">
      <section class="panel views" aria-label="三视图">
        <div class="row" style="justify-content:space-between">
          <h2>三视图（正交投影）</h2>
          <label class="lab" for="tint" style="display:inline-flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="tint" checked> 按朝向上色</label>
        </div>
        <div class="vgrid">
          <div class="vcell"><canvas id="mv-front" width="480" height="360" aria-label="正视图"></canvas><span>正视</span></div>
          <div class="vcell"><canvas id="mv-side" width="480" height="360" aria-label="侧视图"></canvas><span><span id="side-label">侧视（从右看）</span><button id="flip-side">换另一侧</button></span></div>
          <div class="vcell"><canvas id="mv-top" width="480" height="360" aria-label="俯视图"></canvas><span>俯视</span></div>
          <div class="vcell"><canvas id="mv-iso" width="480" height="360" aria-label="斜视图"></canvas><span>斜视</span></div>
        </div>
      </section>
      <section class="panel photos" id="photos" aria-label="实拍照片">
        <h2>实拍三视图</h2>
        <div class="pgrid">
          <figure><img id="ph-front" alt=""><figcaption>正视</figcaption></figure>
          <figure><img id="ph-side" alt=""><figcaption>侧视</figcaption></figure>
          <figure><img id="ph-top" alt=""><figcaption>俯视</figcaption></figure>
        </div>
      </section>
      <section class="panel note" aria-live="polite">
        <h2 id="note-title">说明</h2>
        <p id="note-text"></p>
      </section>
    </div>
  </div>

  <details class="code">
    <summary>方案代码（复制保存 / 粘贴载入）</summary>
    <textarea id="code" spellcheck="false" aria-label="方案代码"></textarea>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="btn-copy">复制代码</button>
      <button class="btn" id="btn-load">载入上面的代码</button>
    </div>
  </details>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script>
(function () {
  // ---------------- preset data ----------------
  // u,v: position in the top-view photo (u → right, v → down), in cup diameters.
  // front: where the front-view camera stood in that photo (W/E/S); side: 'R' or 'L' of the front viewer.
  // s: U 正放 · D 倒扣 · HG 沙漏(下倒扣上正放) · BR 腰鼓(下正放上倒扣) · S 侧放(open = 杯口方向)
  var R1 = [
    { front: 'W', side: 'R', cols: [[0,0,'D'],[1,0,'U'],[0,1,'HG'],[1,1,'BR'],[2,1,'D'],[1,2,'D'],[1,3,'D']],
      hidden: '中间那摞腰鼓的下层杯三张图都拍不到，只能从上层倒扣杯在第二层高度反推它是正放。' },
    { front: 'W', side: 'R', cols: [[0,0,'U'],[1,0,'HG'],[0,1,'HG'],[1,1,'U'],[0,2,'U'],[1,2,'U'],[1,3,'D']],
      hidden: '右上角沙漏的下层杯三张图都拍不到，只能从上层正放杯在第二层高度反推它是倒扣。' },
    { front: 'E', side: 'R', cols: [[0.3,0.3,'U'],[1.9,0,'BR'],[0.95,0.95,'HG'],[1.9,0.95,'D'],[0.3,1.6,'BR'],[1.9,1.9,'U']],
      hidden: '左下腰鼓的下层杯三张图都拍不到，只能从高度反推它是正放。' },
    { front: 'W', side: 'R', cols: [[0,0,'D'],[0,0.95,'U'],[0,1.9,'D'],[0,2.85,'BR'],[1,1.9,'D'],[1.95,1,'U'],[1.9,-0.05,'BR']],
      hidden: '右上腰鼓的下层杯三张图都拍不到，只能从高度反推它是正放。' },
    { front: 'S', side: 'R', cols: [[-1,0,'HG'],[0,0,'U'],[1,0,'D'],[1.95,0,'U'],[0,-0.97,'BR'],[1.02,-0.97,'HG']],
      hidden: '后排左边腰鼓的下层杯三张图都拍不到，只能从高度反推它是正放。' },
    { front: 'S', side: 'R', cols: [[0,0,'U'],[1,0,'D'],[1.95,0,'U'],[0,-1,'HG'],[1,-1,'HG'],[0,-2,'HG']],
      hidden: '中排左边沙漏的下层杯三张图都拍不到，只能从高度反推它是倒扣。' }
  ];
  // round 2: items {u,v,s,open,straws:[...]}
  // Two ways a straw sits in a cup (all lengths in cm, directions in top-photo coordinates):
  //   bent(d):          bent 90°, short piece lying flat on the floor, long piece standing straight up
  //                     against the wall on side d (so it is NOT in the middle of the cup)
  //   straight(d, head): not bent, foot on the floor at the wall opposite d, leaning on the rim on side d;
  //                     head = 'up' (short end with the bellows at the top) or 'down' (short end on the floor)
  // Straws only run front-back or left-right (orthogonal), along a diameter of the cup floor.
  // Two straws on the same diameter lie side by side with an empty gap running exactly along that
  // diameter; `side` (+1/-1, toward +v or +u in the photo) says which half each one takes.
  function it(u, v, s, extra) { var o = { u: u, v: v, s: s }; for (var k in extra) o[k] = extra[k]; return o; }
  function bent(d, side) { return { kind: 'bent', dir: d, side: side }; }
  function straight(d, head, side) { return { kind: 'straight', dir: d, head: head, side: side }; }
  var R2 = [
    { front: 'E', side: 'L', items: [
      it(-1,-1,'D'), it(0,-1,'U',{straws:[bent([0,-1])]}), it(-1,0,'S',{open:[0,1]}), it(0,0,'BR'),
      it(1.05,0,'S',{open:[1,0]}), it(0,1.05,'U',{straws:[bent([0,1])]}) ],
      text: '中间腰鼓的下层杯三张图都拍不到。注意这一组的侧视照片是从正视的左手边拍的，和其他组相反。' },
    { front: 'W', side: 'R', items: [
      it(0,-1.95,'S',{open:[0,-1]}), it(0,-0.95,'D'), it(-0.95,0,'HG'), it(0,0,'U',{straws:[bent([1,0])]}),
      it(1.05,0,'S',{open:[1,0]}), it(0,1.1,'U',{straws:[bent([-1,0])]}) ],
      text: '沙漏两层在正视里都能看到。两根吸管都是 90° 折弯：短段平躺杯底，长段贴着杯壁竖直立起，所以长段不在杯子正中，两根分别贴在相反的两侧。' },
    { front: 'W', side: 'R', items: [
      it(0,-0.9,'U',{straws:[straight([1,0],'up')]}), it(-1,0,'D'), it(0,0,'D'), it(1.1,0,'S',{open:[1,0]}),
      it(-1,1.0,'S',{open:[0,1]}), it(0,1.1,'U',{straws:[bent([-1,0])]}), it(1,1.15,'D') ],
      text: '7 只杯全是单层，没有叠放。上方杯的吸管没有折弯，头朝上（折弯段在上），斜靠在杯沿上；下方杯的吸管 90° 折弯，短段平躺杯底，长段贴着靠正视一侧的杯壁竖起。' },
    { front: 'W', side: 'R', items: [
      it(0,-1.95,'D'), it(-0.05,-1.0,'S',{open:[-1,0]}), it(1.0,-1.05,'BR'), it(-1,0,'D'), it(0,0,'U'),
      it(1,0,'U',{straws:[bent([-1,0],1), straight([1,0],'down',-1)]}) ],
      text: '右下那只杯插了两根吸管：一根 90° 折弯，长段贴着靠正视一侧的杯壁竖起；另一根没有折弯，头朝下（折弯段在杯底），斜靠在后侧杯沿上。两根沿同一条直径并排，中间留一条沿直径的缝。右上腰鼓的下层杯三张图都拍不到，只能从高度反推它是正放。' }
  ];
  // round 2 designed groups, already in world convention (u = X right, v = Z toward front viewer)
  var R2D = [
    { front: 'S', side: 'R', designed: true, items: [
      it(0,0,'HG',{straws:[bent([1,0])]}), it(1,0,'D'), it(2,0.04,'S',{open:[0,1]}), it(-1.05,0,'S',{open:[-1,0]}),
      it(0,1.05,'D'), it(1,1.05,'U',{straws:[straight([0,-1],'up')]}) ],
      text: '设计组。正视里中间看起来像一个沙漏，其实下半截是前排一只单独的倒扣杯，真正的沙漏在它后面，俯视才能看出来。沙漏下层杯三张图都被挡住，只能从高度反推它是倒扣。' },
    { front: 'S', side: 'R', designed: true, items: [
      it(0,0,'BR'), it(1,0,'U',{straws:[straight([1,0],'down')]}), it(1.05,-1,'S',{open:[1,0]}),
      it(-1,0,'U',{straws:[bent([0,1])]}), it(0,1.05,'D'), it(1,1.05,'S',{open:[0,1]}) ],
      text: '设计组。正视里中间像是两只倒扣杯叠在一起，但同向会套进去，说明上面那只在后排，是腰鼓的上层。右边正放杯的吸管没有折弯，头朝下斜靠在右侧杯沿上：侧视里它正对镜头方向倾斜，看起来是竖直的，只有正视能看出它斜着。腰鼓下层杯三张图都看不到，只能反推它是正放。' }
  ];

  function toWorld(front, u, v) {
    if (front === 'W') return [v, -u];
    if (front === 'E') return [-v, u];
    return [u, v];
  }
  function dirWorld(front, d) { var w = toWorld(front, d[0], d[1]); var l = Math.hypot(w[0], w[1]) || 1; return [w[0] / l, w[1] / l]; }
  function photoUp(front) {
    if (front === 'W') return [-1, 0];
    if (front === 'E') return [1, 0];
    return [0, -1];
  }
  var STACK = { U: ['up'], D: ['down'], HG: ['down', 'up'], BR: ['up', 'down'] };

  function convert(p) {
    var items = [];
    var src = p.cols ? p.cols.map(function (c) { return { u: c[0], v: c[1], s: c[2] }; }) : p.items;
    src.forEach(function (c) {
      var w = toWorld(p.front, c.u, c.v);
      var straws = (c.straws || []).map(function (s) {
        var o = { kind: s.kind, dir: dirWorld(p.front, s.dir) };
        if (s.head) o.head = s.head;
        if (s.side) { var n = toWorld(p.front, Math.abs(s.dir[1]) > 0.5 ? s.side : 0, Math.abs(s.dir[1]) > 0.5 ? 0 : s.side); o.side = n; }
        return o;

  function isolated(items) { return items.filter(function (x) { return items.length > 1 && !hasNeighbour(x, items); }); }

  function canStack(item, orient) {

    if ((item.straws || []).length) return '插了吸管的杯上面不能再叠';
    if (item.cups.length >= 3) return '最多叠三层';

    }

      if (hit.idx !== undefined) return { ok: false, msg: '侧放杯只能放在桌面空位上' };
      var ns = { kind: 'side', x: hit.x, z: hit.z, dir: dir.slice() }, lonely2 = state.items.length && !hasNeighbour(ns, state.items);
      return { ok: !lonely2, msg: lonely2 ? LONELY : '', ghost: { kind: 'side', x: hit.x, z: hit.z, dir: dir.slice() },
        act: function () { state.items.push({ kind: 'side', x: hit.x, z: hit.z, dir: dir.slice(), straws: [] }); } };
    }
    if (tool === 'straw') {
      if (hit.idx === undefined) return { ok: false, msg: '点一只正放的杯来插吸管' };

      if (it3.kind !== 'col') return { ok: false, msg: '侧放杯不插吸管', hover: hit.idx };
